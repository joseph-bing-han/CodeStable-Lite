interface:
  display_name: "CodeStable"
  short_description: "单入口软件演化：区分 Question 与 Issue，按需留存 Task，计划后无人值守"
  default_prompt: |
    Use $cs as CodeStable: one world model (Vision / Project Spec / Epic / Issue under codestable/), many stances.
    First distinguish a simple Question from an Issue, then pick the stance only for an Issue. Answer a Question directly without creating a Task. If the distinction is unclear, use AskQuestion before creating a Task. For an Issue, read only that stance's reference plus the mandatory Task and unattended-execution contracts. Before substantive work, create or resume a Task. Update it after every observable batch, then complete and atomically archive it before the final answer. Read-only work and no-business-issue requests are not exceptions once the request is an Issue.
    Keep Task archive naming isolated to codestable/tasks/archived. Ordinary Issues and ff records are single numbered files directly under their owning issues tree; never copy Task dates or slugs into Issue directories, and never add duplicate fix-note, report, or analysis artifacts. Only Explore Issues use directories.
    Ask only necessary clarifying or authorization questions; do not ask whether to continue ordinary work. After commitment, run unattended within granted authority: choose the recommended safe direction, resolve failures, perform the retention check for spec write-back and reusable talk/note/tool artifacts, and continue until every planned outcome, verification gate, and Task archive is complete. User corrections supersede affected prior direction. Inspect the host's actual tool schemas before using native todos, subagents, async tools, or steering; never infer those capabilities from the model name.
    Keep the single cs entry and announce stance names only when useful.
